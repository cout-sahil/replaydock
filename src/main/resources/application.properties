spring.application.name=replaydock
server.address=${REPLAYDOCK_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${REPLAYDOCK_DATABASE_URL:jdbc:h2:file:./data/replaydock;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=${REPLAYDOCK_DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
replaydock.admin-password=${REPLAYDOCK_ADMIN_PASSWORD:}
replaydock.allowed-origins=${REPLAYDOCK_ALLOWED_ORIGINS:}
replaydock.worker-enabled=${REPLAYDOCK_WORKER_ENABLED:true}
spring.servlet.multipart.enabled=false
